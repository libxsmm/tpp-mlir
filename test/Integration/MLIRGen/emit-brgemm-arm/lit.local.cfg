import subprocess

def is_arch(target):
    # Arch detection not working on Windows
    if sys.platform in ['win32']:
        return False

    try:
        cmd = subprocess.Popen(
            ['uname', '-m'], stdout=subprocess.PIPE)
    except OSError:
        return False

    out = cmd.stdout.read().decode('ascii')
    cmd.wait()

    return target in out

# The emit_brgemm.py generator tests run through the Lighthouse `uv` environment
# (the `emit-brgemm` substitution), so gate the whole directory on the
# 'lighthouse' feature defined in test/lit.cfg.py.
if "lighthouse" not in config.available_features:
    config.unsupported = True

# Enable only on ARM (the generator auto-detects aarch64 and selects the
# ARM-specific bf16 VNNI factor of 4, rejecting non-f32/bf16 types).
if not (is_arch('aarch64') or is_arch('arm64')):
    config.unsupported = True
